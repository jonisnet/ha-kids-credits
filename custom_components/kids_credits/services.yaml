award_points:
  name: Credits toekennen
  description: Ken credits toe aan een kind voor een voltooide taak.
  fields:
    kid_id:
      name: Kind
      description: De id van het kind (zie het attribuut kid_id op zijn/haar sensor).
      required: true
      selector:
        text:
    amount:
      name: Aantal credits
      required: true
      selector:
        number:
          min: 1
          max: 50
          mode: box
    reason:
      name: Reden
      description: Welke taak of activiteit dit was.
      required: true
      selector:
        text:
    actor:
      name: Toegekend door
      description: Optioneel, wie dit heeft toegekend (papa/mama).
      required: false
      selector:
        text:

deduct_points:
  name: Credits afnemen
  description: Trek credits af bij een kind, bijvoorbeeld bij ongewenst gedrag.
  fields:
    kid_id:
      name: Kind
      required: true
      selector:
        text:
    amount:
      name: Aantal credits
      required: true
      selector:
        number:
          min: 1
          max: 50
          mode: box
    reason:
      name: Reden
      required: true
      selector:
        text:
    actor:
      name: Afgeboekt door
      required: false
      selector:
        text:

set_kid_photo:
  name: Foto van kind instellen
  description: Slaat een geüploade foto (of een leeg veld om terug te vallen op het icoon) op voor een kind.
  fields:
    kid_id:
      name: Kind
      required: true
      selector:
        text:
    photo:
      name: Foto
      description: Een data: URI (base64) van de foto, of leeg om de foto te verwijderen.
      required: false
      selector:
        text:

request_credit:
  name: Credits aanvragen
  description: Een kind vraagt credits aan voor een klus die het gedaan zegt te hebben. Wijzigt het saldo nog niet - wacht op goedkeuring.
  fields:
    kid_id:
      name: Kind
      required: true
      selector:
        text:
    reason:
      name: Wat heb je gedaan?
      required: true
      selector:
        text:

approve_request:
  name: Verzoek goedkeuren
  description: Keurt een openstaand credit-verzoek goed en kent de credits toe.
  fields:
    request_id:
      name: Verzoek
      required: true
      selector:
        text:
    amount:
      name: Aantal credits
      required: true
      selector:
        number:
          min: 1
          max: 50
          mode: box
    actor:
      name: Goedgekeurd door
      required: false
      selector:
        text:

reject_request:
  name: Verzoek afwijzen
  description: Wijst een openstaand credit-verzoek af, zonder credits toe te kennen.
  fields:
    request_id:
      name: Verzoek
      required: true
      selector:
        text:
    actor:
      name: Afgewezen door
      required: false
      selector:
        text:

redeem_reward:
  name: Beloning verzilveren
  description: Trek credits af omdat een beloning is uitgekeerd (bv. bij 15 credits).
  fields:
    kid_id:
      name: Kind
      required: true
      selector:
        text:
    amount:
      name: Aantal credits
      required: true
      selector:
        number:
          min: 1
          max: 50
          mode: box
    reason:
      name: Reden
      description: Welke beloning is uitgekeerd.
      required: true
      selector:
        text:
    actor:
      name: Uitgekeerd door
      required: false
      selector:
        text:
